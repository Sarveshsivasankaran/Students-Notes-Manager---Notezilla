<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Profile - Notezilla</title>
    <link rel="icon" type="image/svg+xml" href="images/notezilla-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #8b5cf6;
            --dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo img {
            height: 32px;
            filter: brightness(0) invert(1);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: white;
            transform: translateX(-4px);
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 40px;
            align-items: center;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.2);
        }

        .profile-info h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .profile-info .email {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: flex;
            gap: 32px;
            margin-bottom: 24px;
        }

        .stat-item {
            text-align: left;
        }

        .stat-value {
            display: block;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-light);
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .profile-bio {
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .note-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: 0.3s;
            cursor: pointer;
        }

        .note-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .note-type {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light);
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .note-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .note-meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }

        .btn-download {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .note-card:hover .btn-download {
            background: var(--primary);
            border-color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px dashed var(--border);
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .profile-card {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 24px;
            }

            .profile-avatar {
                margin: 0 auto;
            }

            .profile-stats {
                justify-content: center;
            }

            .stat-item {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <a href="faculty-browse.html" class="logo">
                <img src="images/notezilla-logo.svg" alt="Notezilla"
                    style="height:32px; filter: brightness(0) invert(1);">
            </a>
            <div id="userDisplay" style="font-size: 14px; color: var(--text-muted);"></div>
        </nav>

        <a href="faculty-browse.html" class="back-link">← Back to Faculty List</a>

        <!-- Faculty Profile -->
        <div id="facultyProfile" class="profile-card">
            <div class="profile-avatar" id="avatar">👨‍🏫</div>
            <div class="profile-info">
                <h1 id="facultyName">Loading...</h1>
                <p class="email" id="facultyEmail">...</p>
                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="rating">0.0</span>
                        <span class="stat-label">Rating</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="downloads">0</span>
                        <span class="stat-label">Downloads</span>
                    </div>
                </div>
                <p class="profile-bio" id="facultyBio">Loading faculty profile information...</p>
            </div>
        </div>

        <!-- Notes Section -->
        <h2 class="section-title">📚 Published Notes</h2>
        <div id="notesGrid" class="notes-grid">
            <!-- Notes injected here -->
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const facultyId = localStorage.getItem('selectedFacultyId');

        if (!facultyId) {
            window.location.href = 'faculty-browse.html';
        }

        window.addEventListener('load', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userDisplay').textContent = user.name || '';

            fetchFacultyDetails();
            fetchFacultyNotes();
        });

        async function fetchFacultyDetails() {
            try {
                const response = await fetch(`${API_URL}/faculty/${facultyId}`);
                const data = await response.json();
                if (data.success) {
                    const f = data.data;
                    document.getElementById('facultyName').textContent = f.name;
                    document.getElementById('facultyEmail').textContent = f.email;
                    document.getElementById('rating').textContent = f.averageRating ? f.averageRating.toFixed(1) : 'New';
                    document.getElementById('downloads').textContent = f.totalDownloads || 0;
                    document.getElementById('facultyBio').textContent = f.bio || 'No bio available for this faculty member.';
                    document.getElementById('avatar').textContent = f.name.charAt(0);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function fetchFacultyNotes() {
            try {
                const response = await fetch(`${API_URL}/faculty/${facultyId}/notes`);
                const data = await response.json();
                const grid = document.getElementById('notesGrid');

                if (data.success && data.data.length > 0) {
                    grid.innerHTML = data.data.map(note => `
                        <div class="note-card" onclick="viewNote('${note.id}', '${note.fileUrl}')">
                            <span class="note-type">${note.type}</span>
                            <h3 class="note-title">${note.title}</h3>
                            <p class="note-meta">
                                ${note.subject} · Unit ${note.unit} · Sem ${note.semester}
                            </p>
                            <div class="note-stats" style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                                📥 ${note.downloads || 0} downloads · v${note.version}
                            </div>
                            <button class="btn-download">
                                <span>Download PDF</span>
                            </button>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="empty-state">No verified notes available from this faculty yet.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function viewNote(id, url) {
            // Track download
            fetch(`${API_URL}/notes/${id}/download`, { method: 'POST' });

            // Open file
            window.open(url, '_blank');
        }
    </script>
</body>

</html>
