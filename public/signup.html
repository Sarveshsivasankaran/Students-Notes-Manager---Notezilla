<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Notezilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section {
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 10px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-signup:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .login-link a:hover {
            color: #8b5cf6;
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6366f1;
            font-size: 13px;
        }

        .loading.show {
            display: block;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .role-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-option input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .role-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .role-fields {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            display: none;
            margin-bottom: 15px;
        }

        .role-fields.show {
            display: block;
        }

        .role-fields p {
            font-size: 12px;
            color: #64748b;
            margin: 0 0 10px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-section">
                <img src="/images/notezilla-logo.svg" alt="Notezilla"
                    style="width:180px;display:block;margin:0 auto 8px;">
            </div>
            <h1 class="title">Sign Up</h1>
            <p class="subtitle">Create your account and start managing notes</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label>Select Your Role</label>
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" id="roleStudent" name="role" value="student" required checked>
                        <label for="roleStudent">👨‍🎓 Student</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleStaff" name="role" value="staff" required>
                        <label for="roleStaff">👨‍🏫 Staff</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span id="emailNote"
                        style="font-size: 12px; color: #6366f1;"></span></label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- Student-specific fields -->
            <div id="studentFields" class="role-fields show">
                <p>Student Details</p>
                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department">
                            <option value="">Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="BioMed">BioMed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <select id="semester" name="semester">
                            <option value="">Select Semester</option>
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                            <option value="4">4th</option>
                            <option value="5">5th</option>
                            <option value="6">6th</option>
                            <option value="7">7th</option>
                            <option value="8">8th</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Staff-specific fields -->
            <div id="staffFields" class="role-fields">
                <p>⏳ Note: Staff accounts require admin approval before activation</p>
            </div>

            <div class="error-message" id="signupError"></div>
            <div class="success-message" id="signupSuccess"></div>
            <div class="loading" id="loading">Creating your account...</div>

            <button type="submit" class="btn-signup" id="submitBtn">Create Account</button>
        </form>

        <div class="divider">OR</div>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        const signupForm = document.getElementById('signupForm');
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const departmentInput = document.getElementById('department');
        const semesterInput = document.getElementById('semester');
        const submitBtn = document.getElementById('submitBtn');
        const signupError = document.getElementById('signupError');
        const signupSuccess = document.getElementById('signupSuccess');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const loading = document.getElementById('loading');
        const studentFields = document.getElementById('studentFields');
        const staffFields = document.getElementById('staffFields');

        // Role selector event listeners
        roleInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                const role = e.target.value;
                const emailNote = document.getElementById('emailNote');
                if (role === 'student') {
                    studentFields.classList.add('show');
                    staffFields.classList.remove('show');
                    departmentInput.required = true;
                    semesterInput.required = true;
                    emailNote.textContent = '(Must be @rajalakshmi.edu.in)';
                } else if (role === 'staff') {
                    studentFields.classList.remove('show');
                    staffFields.classList.add('show');
                    departmentInput.required = false;
                    semesterInput.required = false;
                    emailNote.textContent = '';
                }
            });
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const department = departmentInput.value;
            const semester = semesterInput.value;

            // Validation
            if (!name) {
                showError('nameError', 'Please enter your name');
                return;
            }
            if (!email) {
                showError('emailError', 'Please enter your email');
                return;
            }
            // Students must use @rajalakshmi.edu.in email
            if (role === 'student' && !email.endsWith('@rajalakshmi.edu.in')) {
                showError('emailError', 'Students must use @rajalakshmi.edu.in email address');
                return;
            }
            if (password.length < 6) {
                showError('passwordError', 'Password must be at least 6 characters');
                return;
            }
            if (role === 'student' && !department) {
                showError('signupError', 'Please select your department');
                return;
            }
            if (role === 'student' && !semester) {
                showError('signupError', 'Please select your semester');
                return;
            }

            try {
                submitBtn.disabled = true;
                loading.classList.add('show');

                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        role,
                        department: role === 'student' ? department : null,
                        semester: role === 'student' ? parseInt(semester) : null
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    showError('signupError', data.message);
                    submitBtn.disabled = false;
                    loading.classList.remove('show');
                    return;
                }

                // Save token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Show success and redirect
                const message = role === 'staff'
                    ? 'Registration successful! Awaiting admin approval. Redirecting...'
                    : 'Account created successfully! Redirecting...';
                showSuccess(message);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Signup error:', error);
                showError('signupError', 'Connection error. Make sure the server is running.');
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        function clearErrors() {
            [nameError, emailError, passwordError, signupError, signupSuccess].forEach(el => {
                el.textContent = '';
                el.classList.remove('show');
            });
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
        }

        function showSuccess(message) {
            const el = document.getElementById('signupSuccess');
            el.textContent = message;
            el.classList.add('show');
        }
    </script>
</body>

</html>
