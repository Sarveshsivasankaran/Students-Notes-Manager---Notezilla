<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Notezilla</title>
    <link rel="icon" type="image/png" href="images/notezilla-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #8b5cf6;
            --dark: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
        }

        .left-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
        }

        .left-panel img {
            width: 80%;
            max-width: 300px;
            filter: brightness(0) invert(1);
        }

        .right-panel {
            flex: 1.2;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .right-panel::-webkit-scrollbar {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input,
        select {
            width: 100%;
            padding: 9px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: white;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        option {
            background: #1e1b4b;
            color: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-signup {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.2);
            margin-top: 4px;
        }

        .btn-signup:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .divider {
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .login-link {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .login-link a {
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        .error-message,
        .success-message,
        .loading {
            font-size: 11px;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .error-message {
            color: #fb7185;
            display: none;
            background: rgba(251, 113, 133, 0.1);
        }

        .success-message {
            color: #22c55e;
            display: none;
            background: rgba(34, 197, 94, 0.1);
        }

        .loading {
            display: none;
            color: var(--primary-light);
            font-weight: 500;
        }

        .error-message.show,
        .success-message.show,
        .loading.show {
            display: block;
        }

        .loading.show {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .role-option {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .role-option:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .role-option.selected {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .role-icon {
            font-size: 18px;
        }

        .role-option label {
            margin: 0;
            color: white;
            cursor: pointer;
            text-transform: none;
            font-size: 12px;
            font-weight: 600;
        }

        .role-fields {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 10px;
            display: none;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .role-fields.show {
            display: block;
        }

        .role-fields p {
            font-size: 11px;
            color: var(--primary-light);
            margin-bottom: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .role-fields .form-group {
            margin-bottom: 6px;
        }

        @supports (-webkit-backdrop-filter: none) or (backdrop-filter: none) {
            .container {
                -webkit-backdrop-filter: blur(20px);
                backdrop-filter: blur(20px);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
                align-items: center;
                overflow: hidden;
            }

            .container {
                flex-direction: column;
                max-width: 400px;
                max-height: 95vh;
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding: 12px;
            }

            .left-panel img {
                max-width: 140px;
            }

            .right-panel {
                padding: 16px;
            }

            .header .title {
                font-size: 20px;
            }

            .role-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <a href="index.html">
                <img src="images/notezilla-logo.PNG" alt="Notezilla" style="width:auto; height:auto;">
            </a>
        </div>
        <div class="right-panel">
            <div class="header">
                <h1 class="title">Sign Up</h1>
                <p class="subtitle">Create your account</p>
            </div>

            <form id="signupForm">
            <div class="form-group">
                <label>Select Role</label>
                <div class="role-selector">
                    <div class="role-option selected" onclick="document.getElementById('roleStudent').click()">
                        <div class="role-icon">👨‍🎓</div>
                        <input type="radio" id="roleStudent" name="role" value="student" required checked>
                        <label for="roleStudent">Student</label>
                    </div>
                    <div class="role-option" onclick="document.getElementById('roleStaff').click()">
                        <div class="role-icon">👨‍🏫</div>
                        <input type="radio" id="roleStaff" name="role" value="staff" required>
                        <label for="roleStaff">Staff</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email <span id="emailNote" style="font-size: 10px; color: #6366f1;"></span></label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div id="studentFields" class="role-fields show">
                <p>🎓 Academic Details</p>
                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department">
                            <option value="">Select</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="BioMed">BioMed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <select id="semester" name="semester">
                            <option value="">Select</option>
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                            <option value="4">4th</option>
                            <option value="5">5th</option>
                            <option value="6">6th</option>
                            <option value="7">7th</option>
                            <option value="8">8th</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="staffFields" class="role-fields">
                <p>⏳ Verification Required</p>
                <div style="font-size: 11px; color: rgba(255, 255, 255, 0.6); line-height: 1.5;">
                    Staff accounts must be verified by an administrator before you can upload notes.
                </div>
            </div>

            <div class="error-message" id="signupError"></div>
            <div class="success-message" id="signupSuccess"></div>
            <div class="loading" id="loading">Creating account...</div>

            <button type="submit" class="btn-signup" id="submitBtn">Create Account</button>
        </form>

            <div class="divider">OR</div>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        const signupForm = document.getElementById('signupForm');
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const departmentInput = document.getElementById('department');
        const semesterInput = document.getElementById('semester');
        const submitBtn = document.getElementById('submitBtn');
        const signupError = document.getElementById('signupError');
        const signupSuccess = document.getElementById('signupSuccess');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const loading = document.getElementById('loading');
        const studentFields = document.getElementById('studentFields');
        const staffFields = document.getElementById('staffFields');

        roleInputs.forEach(function (input) {
            input.addEventListener('change', function (e) {
                var role = e.target.value;
                var emailNoteField = document.getElementById('emailNote');

                document.querySelectorAll('.role-option').forEach(function (opt) {
                    opt.classList.remove('selected');
                });
                e.target.closest('.role-option').classList.add('selected');

                if (role === 'student') {
                    studentFields.classList.add('show');
                    staffFields.classList.remove('show');
                    departmentInput.required = true;
                    semesterInput.required = true;
                    emailNoteField.textContent = '(@rajalakshmi.edu.in)';
                } else if (role === 'staff') {
                    studentFields.classList.remove('show');
                    staffFields.classList.add('show');
                    departmentInput.required = false;
                    semesterInput.required = false;
                    emailNoteField.textContent = '';
                }
            });
        });

        window.addEventListener('load', function () {
            var emailNoteField = document.getElementById('emailNote');
            if (document.getElementById('roleStudent').checked) {
                emailNoteField.textContent = '(@rajalakshmi.edu.in)';
            }
        });

        signupForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearErrors();

            var name = nameInput.value.trim();
            var email = emailInput.value.trim();
            var password = passwordInput.value;
            var role = document.querySelector('input[name="role"]:checked').value;
            var department = departmentInput.value;
            var semester = semesterInput.value;

            if (!name) { showError('nameError', 'Please enter your name'); return; }
            if (!email) { showError('emailError', 'Please enter your email'); return; }
            if (role === 'student' && email.indexOf('@rajalakshmi.edu.in') === -1) {
                showError('emailError', 'Students must use @rajalakshmi.edu.in email');
                return;
            }
            if (password.length < 6) { showError('passwordError', 'Password must be at least 6 characters'); return; }
            if (role === 'student' && !department) { showError('signupError', 'Please select your department'); return; }
            if (role === 'student' && !semester) { showError('signupError', 'Please select your semester'); return; }

            try {
                submitBtn.disabled = true;
                loading.classList.add('show');

                var response = await fetch(API_URL + '/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        role: role,
                        department: role === 'student' ? department : null,
                        semester: role === 'student' ? parseInt(semester) : null
                    })
                });

                var data = await response.json();

                if (!data.success) {
                    showError('signupError', data.message);
                    submitBtn.disabled = false;
                    loading.classList.remove('show');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                var message = role === 'staff'
                    ? 'Registration successful! Awaiting admin approval.'
                    : 'Account created successfully!';
                showSuccess(message);

                setTimeout(function () {
                    if (data.user.role === 'student') {
                        window.location.href = 'faculty-browse.html';
                    } else if (data.user.role === 'staff') {
                        window.location.href = 'staff-upload.html';
                    } else {
                        window.location.href = 'login.html';
                    }
                }, 1500);
            } catch (error) {
                console.error('Signup error:', error);
                showError('signupError', 'Connection error. Make sure the server is running.');
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        function clearErrors() {
            [nameError, emailError, passwordError, signupError, signupSuccess].forEach(function (el) {
                el.textContent = '';
                el.classList.remove('show');
            });
        }

        function showError(elementId, message) {
            var el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
        }

        function showSuccess(message) {
            var el = document.getElementById('signupSuccess');
            el.textContent = message;
            el.classList.add('show');
        }
    </script>
</body>

</html>
