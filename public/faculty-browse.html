<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Faculty - Notezilla</title>
    <link rel="icon" type="image/png" href="images/notezilla-logo.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #8b5cf6;
            --dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo img {
            height: 36px;
            filter: brightness(0) invert(1);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            color: white;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #ef4444;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
        }

        .search-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: white;
            font-family: inherit;
            font-size: 15px;
        }

        .search-bar input:focus {
            outline: none;
        }

        .filter-select {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            cursor: pointer;
        }

        .filter-select option {
            background: #0f172a;
        }

        .faculty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .faculty-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: 0.3s;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .faculty-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .faculty-avatar {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.2);
        }

        .faculty-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .faculty-email {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }

        .faculty-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #fbbf24;
        }

        .faculty-subjects {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .faculty-subjects strong {
            color: white;
        }

        .btn-view {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .faculty-card:hover .btn-view {
            background: var(--primary);
            border-color: var(--primary);
        }

        .sections-tabs {
            display: flex;
            gap: 32px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
        }

        .tab {
            padding: 16px 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px dashed var(--border);
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }

            .user-menu {
                justify-content: center;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }

            .search-bar {
                flex-direction: column;
            }

            .sections-tabs {
                flex-direction: column;
                gap: 8px;
                border-bottom: none;
            }

            .tab {
                width: 100%;
                border-bottom: 1px solid var(--border);
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.02);
            }

            .tab.active {
                background: rgba(99, 102, 241, 0.1);
            }

            .faculty-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navbar -->
        <div class="navbar">
            <div class="logo"><img src="images/notezilla-logo.PNG" alt="Notezilla" style="width:140px; height:80px;">
            </div>
            <div class="nav-links">
                <a href="#bookmarks">My Bookmarks</a>
                <div class="user-menu">
                    <span id="userName" style="font-size: 13px; color: #64748b;"></span>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <h1>Browse Faculty</h1>
            <p>Explore faculty profiles and access their course materials</p>
        </div>

        <!-- Tabs -->
        <div class="sections-tabs">
            <button class="tab active" onclick="switchTab('faculty')">Faculty Profiles</button>
            <button class="tab" onclick="switchTab('subjects')">Subjects</button>
            <button class="tab" onclick="switchTab('notes')">All Notes</button>
        </div>

        <!-- Search & Filter -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search faculty or subjects..." onkeyup="handleSearch()">
            <select id="filterSelect" class="filter-select" onchange="handleFilter()">
                <option value="">All Departments</option>
                <option value="CSE">Computer Science</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil</option>
            </select>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- Faculty Section -->
        <div id="facultySection">
            <div id="facultyGrid" class="faculty-grid"></div>
        </div>

        <!-- Subjects Section -->
        <div id="subjectsSection" style="display: none;">
            <div id="subjectsGrid" class="faculty-grid"></div>
        </div>

        <!-- Notes Section -->
        <div id="notesSection" style="display: none;">
            <div id="notesGrid" class="faculty-grid"></div>
        </div>
    </div>

    <script>
        // Use relative API path for flexibility across environments
        const API_URL = '/api';
        let allFaculty = [];
        let allSubjects = [];
        let allNotes = [];
        let currentTab = 'faculty';

        // Initialize
        window.addEventListener('load', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.name || 'User';

            if (user.role !== 'student') {
                showError('This is a student interface. Please log in as a student.');
                setTimeout(() => logout(), 2000);
                return;
            }

            loadFaculty();
            loadSubjects();
            loadNotes();
        });

        async function loadFaculty() {
            try {
                const response = await fetch(`${API_URL}/faculty`);
                const data = await response.json();
                allFaculty = data.data || [];
                displayFaculty(allFaculty);
            } catch (error) {
                console.error('Error loading faculty:', error);
                showError('Failed to load faculty profiles');
            }
        }

        async function loadSubjects() {
            try {
                const response = await fetch(`${API_URL}/subjects`);
                const data = await response.json();
                allSubjects = data.data || [];
                displaySubjects(allSubjects);
            } catch (error) {
                console.error('Error loading subjects:', error);
                showError('Failed to load subjects');
            }
        }

        async function loadNotes() {
            try {
                const response = await fetch(`${API_URL}/notes`);
                const data = await response.json();
                allNotes = data.data || [];
                displayNotes(allNotes);
            } catch (error) {
                console.error('Error loading notes:', error);
                showError('Failed to load notes');
            }
        }

        function displayFaculty(faculty) {
            const grid = document.getElementById('facultyGrid');
            if (faculty.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No faculty found</p></div>';
                return;
            }

            grid.innerHTML = faculty.map(f => `
                <div class="faculty-card" onclick="viewFacultyProfile('${f.id}')">
                    <div class="faculty-avatar">👨‍🏫</div>
                    <div class="faculty-name">${f.name || 'Unknown'}</div>
                    <div class="faculty-email">${f.email || ''}</div>
                    <div class="faculty-rating">
                        ⭐ ${f.averageRating ? f.averageRating.toFixed(1) : 'New'} · ${f.totalDownloads || 0} downloads
                    </div>
                    <div class="faculty-subjects">
                        <strong>Subjects:</strong><br>
                        ${f.subjects && f.subjects.length > 0 ? f.subjects.map(s => s.name).join(', ') : 'No subjects yet'}
                    </div>
                    <button class="btn-view">View Profile</button>
                </div>
            `).join('');
        }

        function displaySubjects(subjects) {
            const grid = document.getElementById('subjectsGrid');
            if (subjects.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No subjects found</p></div>';
                return;
            }

            grid.innerHTML = subjects.map(s => `
                <div class="faculty-card" onclick="viewSubject('${s.id}')">
                    <div class="faculty-avatar">📚</div>
                    <div class="faculty-name">${s.name}</div>
                    <div class="faculty-email">${s.code}</div>
                    <div class="faculty-rating">
                        Department: ${s.department} · Sem ${s.semester}
                    </div>
                    <div class="faculty-subjects">
                        <strong>Credits:</strong> ${s.credits}<br>
                        <strong>Faculty:</strong> ${s.faculty && s.faculty.length > 0 ? s.faculty.map(f => f.name).join(', ') : 'Unassigned'}
                    </div>
                    <button class="btn-view">View Subject</button>
                </div>
            `).join('');
        }

        function displayNotes(notes) {
            const grid = document.getElementById('notesGrid');
            if (notes.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No notes found</p></div>';
                return;
            }

            grid.innerHTML = notes.map(n => `
                <div class="faculty-card" onclick="viewNote('${n.id}', '${n.fileUrl}')">
                    <div class="faculty-avatar">📄</div>
                    <div class="faculty-name">${n.title}</div>
                    <div class="faculty-email">Unit ${n.unit} · Semester ${n.semester}</div>
                    <div class="faculty-rating">
                        📥 ${n.downloads || 0} downloads · Type: ${n.type}
                    </div>
                    <div class="faculty-subjects">
                        <strong>Subject:</strong> ${n.subject?.name || 'Unknown'}<br>
                        <strong>Faculty:</strong> ${n.faculty?.name || 'Unknown'}
                    </div>
                    <button class="btn-view">View Note</button>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            currentTab = tab;

            // Update buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update sections
            document.getElementById('facultySection').style.display = tab === 'faculty' ? 'block' : 'none';
            document.getElementById('subjectsSection').style.display = tab === 'subjects' ? 'block' : 'none';
            document.getElementById('notesSection').style.display = tab === 'notes' ? 'block' : 'none';
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();

            if (currentTab === 'faculty') {
                const filtered = allFaculty.filter(f =>
                    f.name.toLowerCase().includes(query) ||
                    f.email.toLowerCase().includes(query)
                );
                displayFaculty(filtered);
            } else if (currentTab === 'subjects') {
                const filtered = allSubjects.filter(s =>
                    s.name.toLowerCase().includes(query) ||
                    s.code.toLowerCase().includes(query)
                );
                displaySubjects(filtered);
            } else if (currentTab === 'notes') {
                const filtered = allNotes.filter(n =>
                    n.title.toLowerCase().includes(query)
                );
                displayNotes(filtered);
            }
        }

        function handleFilter() {
            const dept = document.getElementById('filterSelect').value;

            if (currentTab === 'faculty') {
                // Can filter by faculty department if needed
                displayFaculty(allFaculty);
            } else if (currentTab === 'subjects') {
                const filtered = dept ? allSubjects.filter(s => s.department === dept) : allSubjects;
                displaySubjects(filtered);
            }
        }

        function viewFacultyProfile(facultyId) {
            localStorage.setItem('selectedFacultyId', facultyId);
            window.location.href = 'faculty-detail.html';
        }

        function viewSubject(subjectId) {
            localStorage.setItem('selectedSubjectId', subjectId);
            // In real app, navigate to subject-detail.html
            alert('Subject Details - Filtering notes for this subject');
            document.getElementById('searchInput').value = '';
            switchTab('notes');
        }

        function viewNote(noteId) {
            // Navigate to note detail page for viewing and rating
            localStorage.setItem('selectedNoteId', noteId);
            window.location.href = 'note-detail.html';
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
