<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Notezilla</title>
    <link rel="icon" type="image/png" href="images/notezilla-logo.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #8b5cf6;
            --danger: #ef4444;
            --success: #22c55e;
            --dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 16px 32px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 32px;
            filter: brightness(0) invert(1);
            margin-right: 12px;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 14px;
            width: fit-content;
        }

        .tab {
            padding: 10px 24px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .item-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
        }

        .item-info h3 {
            margin-bottom: 6px;
            font-size: 18px;
        }

        .item-info p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            font-family: inherit;
        }

        .btn-approve {
            background: var(--success);
            color: white;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty {
            text-align: center;
            padding: 80px;
            background: var(--card-bg);
            border-radius: 24px;
            color: rgba(255, 255, 255, 0.4);
            border: 1px dashed var(--border);
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
                text-align: center;
            }

            .tabs {
                flex-direction: column;
                width: 100%;
                gap: 8px;
            }

            .tab {
                width: 100%;
            }

            .item-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .actions {
                width: 100%;
                justify-content: flex-start;
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <nav class="navbar">
            <a href="/" class="logo">
                <img src="images/notezilla-logo.PNG" alt="Notezilla"
                    style="height:32px; vertical-align: middle; margin-right: 10px; filter: brightness(0) invert(1);">
                Notezilla Admin
            </a>
            <button class="btn btn-reject" onclick="logout()">Logout</button>
        </nav>

        <div class="tabs">
            <button class="tab active" id="staffTab" onclick="switchTab('staff')">Pending Staff</button>
            <button class="tab" id="notesTab" onclick="switchTab('notes')">Pending Notes</button>
        </div>

        <div id="content" class="grid">
            <!-- Items injected here -->
        </div>
    </div>

    <script>
        // Use relative API path for flexibility across environments
        const API_URL = '/api';
        let currentView = 'staff';
        const token = localStorage.getItem('token');

        window.addEventListener('load', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.role !== 'admin') {
                alert('Access Denied');
                window.location.href = 'login.html';
                return;
            }
            loadPendingStaff();
        });

        function switchTab(view) {
            currentView = view;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(view + 'Tab').classList.add('active');

            if (view === 'staff') loadPendingStaff();
            else loadPendingNotes();
        }

        async function loadPendingStaff() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading staff requests...</div>';

            try {
                const res = await fetch(`${API_URL}/admin/pending-staff`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.data && data.data.length > 0) {
                    content.innerHTML = data.data.map(s => `
                        <div class="item-card">
                            <div class="item-info">
                                <h3>${s.name}</h3>
                                <p>${s.email} · Department: ${s.department || 'Not set'}</p>
                                <p style="font-size: 11px; margin-top: 4px;">Requested on: ${new Date(s.created_at).toLocaleDateString()}</p>
                            </div>
                            <div class="actions">
                                <button class="btn btn-approve" onclick="approveStaff('${s.id}')">Approve</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div class="empty">No pending staff requests</div>';
                }
            } catch (err) {
                content.innerHTML = '<div class="empty">Error loading data</div>';
            }
        }

        async function loadPendingNotes() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading notes verification...</div>';

            try {
                const res = await fetch(`${API_URL}/admin/pending-notes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.data && data.data.length > 0) {
                    content.innerHTML = data.data.map(n => `
                        <div class="item-card">
                            <div class="item-info">
                                <h3>${n.title}</h3>
                                <p>${n.type} · Subject: ${n.subject}</p>
                                <p style="font-size: 12px; color: var(--primary);">Faculty: ${n.faculty}</p>
                            </div>
                            <div class="actions">
                                <button class="btn btn-view" onclick="window.open('${n.fileUrl}', '_blank')">Preview</button>
                                <button class="btn btn-approve" onclick="verifyNote('${n.id}')">Verify</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div class="empty">No notes awaiting verification</div>';
                }
            } catch (err) {
                content.innerHTML = '<div class="empty">Error loading data</div>';
            }
        }

        async function approveStaff(id) {
            if (!confirm('Confirm approval for this staff member?')) return;
            try {
                const res = await fetch(`${API_URL}/admin/approve-staff/${id}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) loadPendingStaff();
            } catch (err) { alert('Error'); }
        }

        async function verifyNote(id) {
            if (!confirm('Verify and publish this note?')) return;
            try {
                const res = await fetch(`${API_URL}/admin/verify-note/${id}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) loadPendingNotes();
            } catch (err) { alert('Error'); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
